name: Windows source build
on:
  push:
    branches: [main, legacy]
    paths:
      - 'desktop/**'
      - 'web/**'
      - 'i18n/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'web/**'
      - 'i18n/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Resolve Rust 1.77-compatible dependency lock
        if: github.ref == 'refs/heads/legacy'
        working-directory: desktop/src-tauri
        run: |
          cargo generate-lockfile
          (Get-Content Cargo.lock -Raw) -replace 'version = 4', 'version = 3' | Set-Content Cargo.lock -NoNewline
          rustup toolchain install 1.77.2 --profile minimal
      - name: Download and verify legacy WebView2 runtime
        if: github.ref == 'refs/heads/legacy'
        shell: pwsh
        run: |
          $cab = Join-Path $env:RUNNER_TEMP 'webview2-109.cab'
          $runtime = 'desktop/src-tauri/WebView2Runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Invoke-WebRequest -Uri 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/e97607f4-c5f1-4684-95c3-c61555f08f19/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab' -OutFile $cab
          expand.exe -F:* $cab $runtime | Out-Null
          $browser = Get-ChildItem $runtime -Filter msedgewebview2.exe -Recurse | Select-Object -First 1
          if (-not $browser) { throw 'Fixed WebView2 109 runtime was not extracted' }
          $signature = Get-AuthenticodeSignature $browser.FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'WebView2 runtime signature is not valid' }
          Write-Host "Verified WebView2 runtime: $($browser.FullName)"
      - name: Build bundled UI
        run: node desktop/scripts/build-ui.mjs
      - name: Build application and installer
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -eq 'refs/heads/legacy') {
            $env:RUSTUP_TOOLCHAIN = '1.77.2'
            npx --yes @tauri-apps/cli@2.11.4 build --no-default-features --features legacy
          } else {
            npx --yes @tauri-apps/cli@^2 build
          }
      - name: Smoke-test legacy WebView runtime
        if: github.ref == 'refs/heads/legacy'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Legacy installer was not generated' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Script Library Legacy/script-library.exe'
          if (-not (Test-Path $app)) { throw "Legacy app was not installed at $app" }
          ./desktop/scripts/screenshot.ps1 -Exe $app -OutDir 'dist/screenshots'
      - name: Collect build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item desktop/src-tauri/Cargo.lock dist/Cargo.lock
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          Copy-Item $installer.FullName dist/
          if ('${{ github.ref }}' -eq 'refs/heads/legacy') {
            Copy-Item desktop/src-tauri/target/release/script-library.exe dist/Script-Library-Legacy-Windows.exe
          } else {
            Copy-Item desktop/src-tauri/target/release/script-library.exe dist/Script-Library-Windows.exe
          }
      - uses: actions/upload-artifact@v4
        with:
          name: script-library-windows-build
          path: dist/**
          if-no-files-found: error

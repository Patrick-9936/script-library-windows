[package]
name = "script-library"
version = "1.0.0-legacy.1"
description = "Script Library — каталог скриптов Null's Brawl для Windows"
edition = "2021"
rust-version = "1.77.2"

[features]
default = ["mica"]
legacy = []
mica = ["dep:window-vibrancy"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-window-state = "=2.4.1"
tauri-plugin-notification = { version = "=2.3.2", features = ["windows7-compat"] }
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-dialog = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "blocking", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = { version = "=0.6.0", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
